# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# Monitors from existing configuration
monitor=,1920x1080@144,auto,1

#monitor = , preferred,auto,auto

# ==================
# STARTUP APPS
# ==================
exec-once = hyprpm reload -n
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target
exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = gnome-keyring-daemon --start --components=secrets,ssh
exec-once = hyprctl setcursor macos-tahoe-cursor 24
exec-once = vicinae server
exec-once = flameshot
exec-once = /usr/bin/emacs --daemon

# ==================
# ENV VARIABLES
# ==================
source = modules/env.conf

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
        drag_lock = false

        
    }
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 0  # off in niri

    col.active_border = rgba(707070ff)
    col.inactive_border = rgba(d0d0d0ff)

    layout = scrolling
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
    blur {
        enabled = yes
        size = 8
        passes = 2
        ignore_opacity = true

        noise = 0.08
        contrast = 1.5
        brightness = 0.8

        new_optimizations = true
    }
}

# ==================
# ANIMATIONS
# ==================

# custom riverine animations
animations {
    enabled = true
    
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    # Windows
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, slide
    animation = windowsOut, 1, 3, md3_accel, popin 60%

    # Layers
    #animation = layersIn, 1, 5, menu_decel, slide left
    #animation = layersOut, 1, 3, menu_accel, slide left
    #animation = fadeLayersIn, 1, 2, menu_decel
    #animation = fadeLayersOut, 1, 4.5, menu_accel

    # Workspaces
    animation = workspaces, 1, 7, menu_decel, slidevert
    animation = specialWorkspace, 1, 3, md3_decel, slidevert

    # Fade
    animation = fade, 1, 3, md3_decel
}

# ==================
# LAYOUTS
# ==================
# -- Layouts and gestures -- #

dwindle {
    # tile floating windows
    pseudotile = true

    # split right side only
    force_split = 2

    # don't change splits on resize
    preserve_split = true
}

master {
    # add extra master windows
    allow_small_split = false

    # scale of windows in special workspace
    #special_scale_factor = 0.95

    # master-slave ratio
    # mfact = 0.5

    # what should new windows be? master/slave/inherit
    new_status = slave

    # new windows top of slaves
    new_on_top = off

    # where should new active windows be?
    new_on_active = before

    # more natural resizing feel
    smart_resizing = on

    # windows drop where you tell them to
    drop_at_cursor = on

    # don't let master window occupy the entire screen even if there are no slaves
    always_keep_position = off
}

plugin{
    hyprscrolling {
        column_width = 0.6                 # each column ~60% of monitor width
        fullscreen_on_one_column = true   # one column doesn’t auto-fullscreen
        follow_focus = true                # view centers on focused window
        focus_fit_method = 0               # 0=center, 1=fit column fully on screen
        explicit_column_widths = 0.5,0.67,0.8,1.0
    }
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# ==================
# WINDOW RULES
# ==================
windowrule = match:class ^(thunar|nemo|nautilus)$, opacity 0.8

windowrule = match:class ^(org\.wezfurlong\.wezterm)$, tile on

windowrule = match:class ^(org\.gnome\.).*$, rounding 12
windowrule = match:class ^(org\.gnome\.).*$, decorate off

windowrule = match:class ^(gnome-control-center)$, tile on
windowrule = match:class ^(pavucontrol)$, tile on
windowrule = match:class ^(nm-connection-editor)$, tile on

windowrule = match:class ^(gnome-calculator)$, float on
windowrule = match:class ^(galculator)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(org\.gnome\.Nautilus)$, float on
windowrule = match:class ^(steam)$, float on
windowrule = match:class ^(xdg-desktop-portal)$, float on

windowrule = match:class ^(org\.wezfurlong\.wezterm)$, decorate off
windowrule = match:class ^(Alacritty)$, decorate off
windowrule = match:class ^(zen)$, decorate off
windowrule = match:class ^(com\.mitchellh\.ghostty)$, decorate off
windowrule = match:class ^(kitty)$, decorate off

windowrule = match:class ^(firefox)$, match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(zoom)$, float on

# DMS windows floating by default
windowrule = match:class ^(org.quickshell)$, float on
windowrule = match:float 0, match:focus 0, opacity 0.9 0.9

layerrule = no_anim on, match:namespace ^(quickshell)$

layerrule = match:namespace ^(vicinae|quickshell)$, blur on
layerrule = match:namespace ^(vicinae)$, ignore_alpha 0.0
layerrule = match:namespace ^(vicinae)$, no_anim on

# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===
bind = $mod, Return, exec, ghostty
bind = ALT, Return, exec, kitty
bind = $mod, E, exec, nautilus
bind = ALT, E, exec, dolphin
bind = $mod, B, exec, zen-browser
bind = $mod SHIFT, B, exec, helium-browser

# === vicinae Controls ===
bind = $mod, space, exec, vicinae toggle
bind = $mod, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history
bind = $mod, period, exec, vicinae vicinae://extensions/vicinae/core/search-emojis

# === DMS Controls ===
bind = ALT, space, exec, dms ipc call spotlight toggle
bind = ALT, V, exec, dms ipc call clipboard toggle
bind = $mod, comma, exec, dms ipc call settings focusOrToggle
bind = $mod, N, exec, dms ipc call notifications toggle
bind = $mod, Y, exec, dms ipc call dankdash wallpaper
bind = $mod, TAB, exec, dms ipc call hypr toggleOverview
bind = ALT, comma, exec, dms ipc call control-center toggle
bind = $mod SHIFT, escape, exec, dms ipc call processlist toggle

# === Cheat sheet (DMS enabled)
bind = $mod SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland

# === Security ===
bind = $mod ALT, L, exec, dms ipc call lock lock
bind = $mod SHIFT, E, exit
bind = $mod, escape, exec, dms ipc call powermenu toggle
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle

# === Audio Controls ===
# bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
# bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
# bindl = , XF86AudioMute, exec, dms ipc call audio mute
# bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# === Window Management ===
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod SHIFT, T, togglefloating
bind = $mod, W, togglegroup
bind = $mod, X, exec, hyprctl kill

# === Focus Navigation ===
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# === Window Movement ===
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# === Column Navigation ===
bind = $mod, Home, focuswindow, first
bind = $mod, End, focuswindow, last

# === Monitor Navigation ===
bind = $mod CTRL, left, focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, J, focusmonitor, d
bind = $mod CTRL, K, focusmonitor, u
bind = $mod CTRL, L, focusmonitor, r

# === Move to Monitor ===
bind = $mod SHIFT CTRL, left, movewindow, mon:l
bind = $mod SHIFT CTRL, down, movewindow, mon:d
bind = $mod SHIFT CTRL, up, movewindow, mon:u
bind = $mod SHIFT CTRL, right, movewindow, mon:r
bind = $mod SHIFT CTRL, H, movewindow, mon:l
bind = $mod SHIFT CTRL, J, movewindow, mon:d
bind = $mod SHIFT CTRL, K, movewindow, mon:u
bind = $mod SHIFT CTRL, L, movewindow, mon:r

# === Workspace Navigation ===
bind = $mod, Page_Down, workspace, e+1
bind = $mod, Page_Up, workspace, e-1
bind = $mod, U, workspace, e+1
bind = $mod, I, workspace, e-1
bind = $mod CTRL, down, movetoworkspace, e+1
bind = $mod CTRL, up, movetoworkspace, e-1
bind = $mod CTRL, U, movetoworkspace, e+1
bind = $mod CTRL, I, movetoworkspace, e-1

# === Move Workspaces ===
bind = $mod SHIFT, Page_Down, movetoworkspace, e+1
bind = $mod SHIFT, Page_Up, movetoworkspace, e-1
bind = $mod SHIFT, U, movetoworkspace, e+1
bind = $mod SHIFT, I, movetoworkspace, e-1

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down, workspace, e-1
bind = $mod, mouse_up, workspace, e+1
bind = $mod CTRL, mouse_down, movetoworkspace, e-1
bind = $mod CTRL, mouse_up, movetoworkspace, e+1

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# === Move to Numbered Workspaces ===
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# === Column Management ===
bind = $mod, bracketleft, layoutmsg, preselect l
bind = $mod, bracketright, layoutmsg, preselect r

# === Sizing & Layout ===
bind = $mod, R, layoutmsg, togglesplit
bind = $mod CTRL, F, resizeactive, exact 100%

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# === Hold to Float ===
# This measures the actual hold duration and only toggles if held long enough.
bindn = $mod, mouse:272, exec, date +%s%N > /tmp/hypr_hold_start
bindrn = $mod, mouse:272, exec, bash -c 'start=$(cat /tmp/hypr_hold_start 2>/dev/null); [ -n "$start" ] && elapsed=$(( ($(date +%s%N) - start) / 1000000 )) && [ $elapsed -ge 500 ] && hyprctl dispatch togglefloating'

# === Manual Sizing ===
bindd = $mod, code:20, Expand window left, resizeactive, -100 0
bindd = $mod, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = $mod, minus, resizeactive, -10% 0
binde = $mod, equal, resizeactive, 10% 0
binde = $mod SHIFT, minus, resizeactive, 0 -10%
binde = $mod SHIFT, equal, resizeactive, 0 10%


# # Screenshot keybinds
# bind = SUPER, P, exec, flameshot gui                                              # Regional screenshot
# bind = SUPER SHIFT, P, exec, flameshot gui -d 3000                               # Regional with 3s delay
# bind = , Print, exec, flameshot full -p ~/Pictures/Screenshots$(date +%Y%m%d_%H%M%S).png# Fullscreen save

# Screenshot keybinds (silent)
bind = SUPER, P, exec, flameshot gui --raw | wl-copy
bind = SUPER SHIFT, P, exec, flameshot gui -d 2000
bind = , Print, exec, flameshot full -p ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png


# # === Screenshots ===
# bind = , Print, exec, dms screenshot
# bind = CTRL, Print, exec, dms screenshot full
# bind = ALT, Print, exec, dms screenshot window

# === System Controls ===
# bind = $mod SHIFT, P, dpms, toggle

# ==================
# CAPSLOCK REMAPPING (Arrow keys)
# ==================
# Capslock + i/j/k/l as arrow keys
bind = CAPS, I, exec, wtype -k up
bind = CAPS, J, exec, wtype -k left
bind = CAPS, K, exec, wtype -k down
bind = CAPS, L, exec, wtype -k right

# Capslock + u/o as Page Up/Page Down
bind = CAPS, U, exec, wtype -k Page_Up
bind = CAPS, O, exec, wtype -k Page_Down

source = ./dms/cursor.conf

source = ./dms/outputs.conf
